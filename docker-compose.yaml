services:
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - ./mongoDevKeyfile.txt:/mongoDevKeyfile.txt
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/mongoDevKeyfile.txt"]
    ports:
      - 27017:27017
  mongo-init:
    image: mongo
    depends_on:
      - mongo
    restart: "no"
    environment:
      MONGO_USER: root
      MONGO_PASS: password
    entrypoint:
      - bash
      - -c
      - |
        set -e

        AUTH=(--host mongo:27017 -u "$$MONGO_USER" -p "$$MONGO_PASS" --authenticationDatabase admin --quiet)

        echo "mongo-init: waiting for mongo..."
        until mongosh "$${AUTH[@]}" --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; do
          sleep 1
        done

        echo "mongo-init: initializing replica set rs0..."
        mongosh "$${AUTH[@]}" --eval '
          try {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
            print("  -> initialized");
          } catch (e) {
            if (e.codeName === "AlreadyInitialized") {
              print("  -> already initialized");
            } else { throw e; }
          }
        '
  # mongo-express disabled 2026-07-20: v1.0.2 crash-looped against the rs0
  # replica set, recreating its veth pair every ~30s and firing
  # ERR_NETWORK_CHANGED in the browser (Docker interface churn read as a
  # network change). Restart policy softened from "always" to "on-failure:5"
  # so it can't loop forever. Before re-enabling, add ?replicaSet=rs0 to
  # ME_CONFIG_MONGODB_URL so it can connect cleanly.
  # mongo-express:
  #   image: mongo-express
  #   restart: "on-failure:5"
  #   ports:
  #     - 8081:8081
  #   environment:
  #     ME_CONFIG_MONGODB_URL: "mongodb://root:password@mongo:27017/?replicaSet=rs0"
  #     ME_CONFIG_MONGODB_ADMINUSERNAME: root
  #     ME_CONFIG_MONGODB_ADMINPASSWORD: password
  redis:
    image: redis
    restart: always
    ports:
      - 6379:6379
  nats:
    image: nats
    restart: always
    ports:
      - 4222:4222
      - 8222:8222
volumes:
  mongo:
