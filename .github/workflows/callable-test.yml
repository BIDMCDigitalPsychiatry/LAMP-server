name: "Task: Test"
on:
  workflow_call:

jobs:
  test:
    name: "Unit + Integration"
    runs-on: ubuntu-24.04
    env:
      # Cache the mongod binary that mongodb-memory-server downloads for the
      # integration project, so reruns don't re-fetch it.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration
